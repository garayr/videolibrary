# Collects BBC headlines every 30 minutes and saves them as news.json
# for the ticker in Gaz's Video Library (Now Showing mode).
name: Update news

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch headlines
        run: |
          python3 - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET, datetime
          FEEDS = [
              ("UK", "https://feeds.bbci.co.uk/news/uk/rss.xml", 5),
              ("World", "https://feeds.bbci.co.uk/news/world/rss.xml", 4),
              ("Sussex", "https://feeds.bbci.co.uk/news/england/sussex/rss.xml", 4),
              ("Sport", "https://feeds.bbci.co.uk/sport/rss.xml", 4),
          ]
          groups = []
          for label, url, n in FEEDS:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "videolibrary-news/1.0"})
                  root = ET.fromstring(urllib.request.urlopen(req, timeout=20).read())
                  items = [{"src": label, "title": (i.findtext("title") or "").strip(), "link": (i.findtext("link") or "").strip()}
                           for i in root.iter("item")]
                  groups.append([i for i in items if i["title"]][:n])
              except Exception as e:
                  print("skipped", label, e)
                  groups.append([])
          mixed = []
          for row in range(max((len(g) for g in groups), default=0)):
              for g in groups:
                  if row < len(g):
                      mixed.append(g[row])
          if mixed:
              out = {"updated": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="minutes"), "items": mixed}
              open("news.json", "w").write(json.dumps(out, ensure_ascii=False, indent=1))
              print(len(mixed), "headlines")
          PY

      - name: Save news.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Update news" && git push)
